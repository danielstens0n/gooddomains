name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m gooddomains import data/demo.txt --source demo
      - run: python -m gooddomains top --profile scientific --limit 5
      - run: python -m gooddomains generate --run ci --count 300
      - run: python -m gooddomains export-check --run ci --count 100 --output data/private/ci
      - run: python -m gooddomains import-check data/private/ci/results-template.csv --provider ci --manifest data/private/ci/manifest.json
      - run: python -m gooddomains experiment-report --run ci
      - run: python -m gooddomains scan-plan --run ci-scan --count 100
      - run: python -m gooddomains scan-pending --run ci-scan
      - run: python -m gooddomains scan-export --run ci-scan --output data/private/ci-scan
