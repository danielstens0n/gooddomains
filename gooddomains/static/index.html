<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gooddomains — find a name worth keeping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap">
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <header><a class="brand" href="/">gooddomains</a></header>
  <main>
    <h1 class="sr-only">Domain explorer</h1>
    <section class="workspace" aria-label="Domain explorer">
      <p class="availability-note">Available .com domains <span>· Registrar-checked; recheck before buying.</span></p>
      <form id="filters" aria-label="Filter available domains">
        <label class="search">Search<input id="query" placeholder="Search names…" autocomplete="off"></label>
        <label>Min. length<input id="min-length" type="number" min="1" max="63" value="1"></label>
        <label>Max. length<input id="max-length" type="number" min="1" max="63" value="63"></label>
        <label>Name type<select id="name-type"><option value="">All types</option><option value="two_words">Two-word compound</option><option value="invented">Made-up word</option><option value="single_word">Single real word</option><option value="affixed">Word + prefix / suffix</option><option value="unclassified">Unclassified</option></select></label>
        <label>Sort by<select id="sort"><option value="shortest">Shortest first</option><option value="longest">Longest first</option><option value="alphabetical">A–Z</option><option value="recent">Recently checked</option><option value="price">Lowest registration price (USD)</option></select></label>
        <label>Shortlist<select id="review"><option value="">All names</option><option value="keep">Kept</option><option value="unreviewed">Unreviewed</option><option value="reject">Passed</option></select></label>
        <label>Registration price<select id="budget"><option value="">Any price</option><option value="20">Up to $20</option><option value="100">Up to $100</option><option value="5000">Up to $5,000</option></select></label>
        <label>Checked within<select id="days"><option value="1">24 hours</option><option value="7" selected>7 days</option><option value="30">30 days</option></select></label>
        <button id="reset-filters" type="button">Reset</button>
      </form>
      <p class="filter-note">Length excludes .com. Types describe how a name was formed; compound means two whole words. Prices are quoted totals for the displayed term.</p>
      <p class="result-count" id="result-count" aria-live="polite">Loading…</p>
      <div class="list-heading"><span>Name</span><span>Name type</span><span class="actions-heading">Actions</span></div>
      <p id="error" role="alert" hidden></p><div id="results"></div>
      <nav class="pagination" aria-label="Results pages"><button id="prev">← Previous</button><span id="page"></span><button id="next">Next →</button></nav>
    </section>
  </main>
</body>
</html>
