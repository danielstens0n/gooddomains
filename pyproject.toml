[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gooddomains"
version = "0.2.0"
description = "An explainable, local-first index for discovering better .com names"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
gooddomains = "gooddomains.cli:main"

[tool.setuptools.package-data]
gooddomains = ["static/*", "words.txt"]

[tool.setuptools.packages.find]
include = ["gooddomains*"]
